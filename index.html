<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/custom.css" />
  </head>
  <body>
    <aside
      class="col-12 col-md-3 col-lg-2 p-3 d-flex flex-column min-vh-100 bg-navy"
    >
     
      <div class="d-flex align-items-center mb-4 px-2">
        <i class="bi bi-buildings-fill fs-4 text-sky me-2"></i>
        <span class="fs-5 fw-bold text-white">Business</span>
      </div

      <nav class="nav nav-pills flex-column gap-1">
        <a
          href="#"
          class="nav-link sidebar-item active d-flex align-items-center"
        >
          <i class="bi bi-stack-overflow fs-5 me-3"></i>
          <span>Overview</span>
        </a>

        <a href="#" class="nav-link sidebar-item d-flex align-items-center">
          <i class="bi bi-graph-down-arrow fs-5 me-3"></i>
          <span>Analytics</span>
        </a>

        <a href="#" class="nav-link sidebar-item d-flex align-items-center">
          <i class="bi bi-cash-coin fs-5 me-3"></i>
          <span>Sales Report</span>
        </a>

        <a href="#" class="nav-link sidebar-item d-flex align-items-center">
          <i class="bi bi-people-fill fs-5 me-3"></i>
          <span>Team Performance</span>
        </a>

        <a href="#" class="nav-link sidebar-item d-flex align-items-center">
          <i class="bi bi-gear-fill fs-5 me-3"></i>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-tip-box p-3 rounded mt-auto">
        <div class="d-flex align-items-center mb-2">
          <i class="bi bi-info-circle-fill text-sky me-2 fs-5"></i>
          <span class="fw-bold text-white small">Usage Tips:</span>
        </div>
        <p class="text-white-50 small mb-0 lh-sm">
          <strong class="text-white">Growth Tip:</strong> Focus on recurring
          revenue this quarter. Retaining existing clients costs 5x less than
          acquiring new ones.
        </p>
      </div>
    </aside>
  </body>
</html>
